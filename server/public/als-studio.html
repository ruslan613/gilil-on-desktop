<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Lighting Studio — Gilil Supply</title>
  <script src="/ui-locale.js"></script>
  <script src="/ui-lang.js"></script>
  <script>
    (function () {
      try {
        var id = localStorage.getItem('gilil_theme') || 'dark';
        if (id === 'beige') id = 'bitrix';
        if (id === 'blue') id = 'cyan';
        var ok = { dark: 1, bitrix: 1, cyan: 1 };
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'beige') q = 'bitrix';
        if (q === 'blue') q = 'cyan';
        if (q && ok[q]) id = q;
        if (!ok[id]) id = 'dark';
        document.documentElement.dataset.theme = id;
        document.documentElement.dataset.surface = 'rich';
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.dataset.surface = 'rich';
      }
    })();
  </script>
  <link rel="stylesheet" href="/themes.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--bg-grad, var(--bg));
      background-color: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.45;
    }
    .wrap { max-width: 780px; margin: 0 auto; padding: 24px 16px 56px; }
    header h1 { font-size: 1.55rem; margin: 0 0 4px; letter-spacing: -0.02em; }
    header p { margin: 0 0 18px; color: var(--muted); font-size: 0.95rem; }
    header a { color: var(--accent); }
    .card {
      background: var(--card, var(--bg-card));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .card h2 { margin: 0 0 12px; font-size: 1.05rem; }
    label.fld { display: block; margin: 0 0 10px; font-size: 0.85rem; color: var(--muted); }
    label.fld > span { display: block; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg-card-2, var(--chip, #1a1612));
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    .btn {
      border: 1px solid var(--line);
      background: var(--accent, #c9a227);
      color: #111;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.92rem;
    }
    .btn.ghost { background: transparent; color: var(--ink); }
    .msg { margin: 8px 0 0; font-size: 0.88rem; color: var(--muted); }
    .msg.err { color: #e07070; }
    .msg.ok { color: #6ecf8e; }
    .item { position: relative; }
    .item .meta {
      display: flex; flex-wrap: wrap; gap: 6px 10px;
      font-size: 0.78rem; color: var(--muted); margin-bottom: 6px;
    }
    .chip {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--bg-card-2, transparent);
      font-size: 0.75rem;
    }
    .chip.pass { border-color: #3d8f5a; color: #6ecf8e; }
    .chip.fail { border-color: #a04545; color: #e07070; }
    .chip.agent { border-color: #6a8cff; color: #9bb0ff; }
    .item h3 { margin: 0 0 6px; font-size: 1rem; }
    .item .body { white-space: pre-wrap; font-size: 0.9rem; }
    .item .paths, .item .run {
      margin-top: 8px; font-size: 0.8rem; color: var(--muted);
      word-break: break-all;
    }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    #auth-warn { display: none; }
    #auth-warn.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>AI Lighting Studio</h1>
      <p><span data-i18n="lead">Статус работ в Gilil Supply / Gilil On · проект «AI Lighting Studio»</span> · <a href="/shell-v2.html" data-i18n="back">← в оболочку</a></p>
    </header>

    <div class="card" id="auth-warn">
      <strong data-i18n="needLogin">Нужен вход.</strong> <span data-i18n="needLoginBody">Откройте Gilil On, войдите, затем обновите эту страницу.</span>
    </div>

    <div class="card">
      <h2 data-i18n="manual">Ручное обновление</h2>
      <form id="form">
        <div class="row">
          <label class="fld"><span data-i18n="week">Неделя</span>
            <select name="week" id="week">
              <option value="week1">week1</option>
              <option value="week2" selected>week2</option>
              <option value="week3">week3</option>
              <option value="week4">week4</option>
              <option value="week5">week5</option>
              <option value="week6">week6</option>
              <option value="week7">week7</option>
              <option value="week8">week8</option>
            </select>
          </label>
          <label class="fld"><span data-i18n="status">Статус</span>
            <select name="status" id="status">
              <option value="in_progress" selected data-i18n="st.progress">В работе</option>
              <option value="done" data-i18n="st.done">Готово</option>
              <option value="blocked" data-i18n="st.blocked">Заблокировано</option>
            </select>
          </label>
          <label class="fld"><span data-i18n="accept">Приёмка</span>
            <select name="accept" id="accept">
              <option value="" selected data-i18n="accept.none">— нет —</option>
              <option value="PASS">PASS</option>
              <option value="FAIL">FAIL</option>
            </select>
          </label>
        </div>
        <label class="fld"><span data-i18n="titleLbl">Заголовок</span>
          <input name="title" id="title" maxlength="500" placeholder="Кратко: что сделано" data-i18n-placeholder="titlePh" />
        </label>
        <label class="fld"><span data-i18n="noteLbl">Заметка / комментарий</span>
          <textarea name="body" id="body" placeholder="Прогресс, PASS/FAIL комментарий, детали…" data-i18n-placeholder="notePh"></textarea>
        </label>
        <button type="submit" class="btn" data-i18n="save">Сохранить в Gilil Supply</button>
        <div class="msg" id="form-msg"></div>
      </form>
    </div>

    <div class="toolbar">
      <button type="button" class="btn ghost" id="btn-reload" data-i18n="reload">Обновить список</button>
      <span class="msg" id="list-msg"></span>
    </div>
    <div id="list"></div>
  </div>
  <script>
    const ALS_DICT = {
      zh: {
        title: 'AI Lighting Studio — Gilil Supply',
        lead: 'Gilil Supply / Gilil On 中的工作状态 · 项目「AI Lighting Studio」',
        back: '← 返回外壳',
        needLogin: '需要登录。',
        needLoginBody: '打开 Gilil On，登录后再刷新此页。',
        manual: '手动更新',
        week: '周', status: '状态', accept: '验收',
        'st.progress': '进行中', 'st.done': '完成', 'st.blocked': '受阻',
        'accept.none': '— 无 —',
        titleLbl: '标题', titlePh: '简要说明完成了什么',
        noteLbl: '备注', notePh: '进度、PASS/FAIL 说明、细节…',
        save: '保存到 Gilil Supply',
        reload: '刷新列表',
        noToken: '没有令牌',
        loading: '加载中…',
        updates: '{n} 条更新',
        none: '还没有更新。',
        signInFirst: '请先登录 Gilil On',
        saving: '正在保存…',
        saved: '已保存到 Gilil Supply（id={id}）',
        err: '错误 ',
        net: '网络：',
        paths: '路径：',
        run: '运行：',
        noTitle: '（无标题）',
      },
      ru: {
        title: 'AI Lighting Studio — Gilil Supply',
        lead: 'Статус работ в Gilil Supply / Gilil On · проект «AI Lighting Studio»',
        back: '← в оболочку',
        needLogin: 'Нужен вход.',
        needLoginBody: 'Откройте Gilil On, войдите, затем обновите эту страницу.',
        manual: 'Ручное обновление',
        week: 'Неделя', status: 'Статус', accept: 'Приёмка',
        'st.progress': 'В работе', 'st.done': 'Готово', 'st.blocked': 'Заблокировано',
        'accept.none': '— нет —',
        titleLbl: 'Заголовок', titlePh: 'Кратко: что сделано',
        noteLbl: 'Заметка / комментарий', notePh: 'Прогресс, комментарий PASS/FAIL, детали…',
        save: 'Сохранить в Gilil Supply',
        reload: 'Обновить список',
        noToken: 'нет токена',
        loading: 'загрузка…',
        updates: '{n} обновл.',
        none: 'Пока нет обновлений.',
        signInFirst: 'Сначала войдите в Gilil On',
        saving: 'сохранение…',
        saved: 'Сохранено в Gilil Supply (id={id})',
        err: 'ошибка ',
        net: 'сеть: ',
        paths: 'Пути:',
        run: 'Запуск:',
        noTitle: '(без заголовка)',
      },
      en: {
        title: 'AI Lighting Studio — Gilil Supply',
        lead: 'Work status in Gilil Supply / Gilil On · project “AI Lighting Studio”',
        back: '← back to the shell',
        needLogin: 'Sign-in required.',
        needLoginBody: 'Open Gilil On, sign in, then refresh this page.',
        manual: 'Manual update',
        week: 'Week', status: 'Status', accept: 'Acceptance',
        'st.progress': 'In progress', 'st.done': 'Done', 'st.blocked': 'Blocked',
        'accept.none': '— none —',
        titleLbl: 'Title', titlePh: 'Short note of what was done',
        noteLbl: 'Note', notePh: 'Progress, PASS/FAIL comment, details…',
        save: 'Save to Gilil Supply',
        reload: 'Reload list',
        noToken: 'no token',
        loading: 'loading…',
        updates: '{n} updates',
        none: 'No updates yet.',
        signInFirst: 'Sign in to Gilil On first',
        saving: 'saving…',
        saved: 'Saved to Gilil Supply (id={id})',
        err: 'error ',
        net: 'network: ',
        paths: 'Paths:',
        run: 'Run:',
        noTitle: '(no title)',
      },
    };
    let reloadAls = function () {};
    const tr = window.GililPageLang.bind(ALS_DICT, function () { reloadAls(); });
    function getToken() {
      try {
        return (
          localStorage.getItem('gilil_access_token') ||
          localStorage.getItem('gilil_token') ||
          sessionStorage.getItem('gilil_access_token') ||
          sessionStorage.getItem('gilil_token') ||
          ''
        );
      } catch (_) { return ''; }
    }
    function authHeaders() {
      var t = getToken();
      var h = { Accept: 'application/json', 'Content-Type': 'application/json' };
      if (t) h.Authorization = 'Bearer ' + t;
      return h;
    }
    function chipAccept(a) {
      if (a === 'PASS') return '<span class="chip pass">PASS</span>';
      if (a === 'FAIL') return '<span class="chip fail">FAIL</span>';
      return '';
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    async function loadList() {
      var msg = document.getElementById('list-msg');
      var warn = document.getElementById('auth-warn');
      if (!getToken()) {
        warn.classList.add('show');
        msg.textContent = tr('noToken');
        return;
      }
      warn.classList.remove('show');
      msg.textContent = tr('loading');
      try {
        var r = await fetch('/api/als/updates?limit=50', { headers: authHeaders() });
        var data = await r.json().catch(function () { return {}; });
        if (!r.ok) {
          if (data && data.message) console.warn('[als]', data.error, data.message);
          msg.textContent = window.GililLocale.userError((data && data.error) || '', GililPageLang.lang());
          if (r.status === 401) warn.classList.add('show');
          return;
        }
        var items = data.items || [];
        msg.textContent = tr('updates').replace('{n}', String(items.length));
        var root = document.getElementById('list');
        if (!items.length) {
          root.innerHTML = '<div class="card"><p class="msg">' + esc(tr('none')) + '</p></div>';
          return;
        }
        root.innerHTML = items.map(function (it) {
          var paths = '';
          if (it.paths && it.paths.length) {
            paths = '<div class="paths"><strong>' + esc(tr('paths')) + '</strong><br>' +
              (Array.isArray(it.paths) ? it.paths : [it.paths]).map(esc).join('<br>') + '</div>';
          }
          var run = it.how_to_run
            ? '<div class="run"><strong>' + esc(tr('run')) + '</strong><br><code>' + esc(it.how_to_run) + '</code></div>'
            : '';
          return (
            '<article class="card item">' +
            '<div class="meta">' +
              '<span class="chip">' + esc(it.week) + '</span>' +
              '<span class="chip">' + esc(it.status) + '</span>' +
              chipAccept(it.accept) +
              (it.source === 'agent' ? '<span class="chip agent">agent</span>' : '<span class="chip">user</span>') +
              '<span>' + esc(it.created_at) + '</span>' +
              (it.author ? '<span>@' + esc(it.author) + '</span>' : '') +
            '</div>' +
            '<h3>' + esc(it.title || tr('noTitle')) + '</h3>' +
            (it.body ? '<div class="body">' + esc(it.body) + '</div>' : '') +
            paths + run +
            '</article>'
          );
        }).join('');
      } catch (e) {
        console.warn('[als]', e && e.message);
        msg.textContent = window.GililLocale.userError('network', GililPageLang.lang());
      }
    }
    document.getElementById('btn-reload').addEventListener('click', loadList);
    document.getElementById('form').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var out = document.getElementById('form-msg');
      if (!getToken()) {
        out.className = 'msg err';
        out.textContent = tr('signInFirst');
        document.getElementById('auth-warn').classList.add('show');
        return;
      }
      out.className = 'msg';
      out.textContent = tr('saving');
      var payload = {
        week: document.getElementById('week').value,
        status: document.getElementById('status').value,
        accept: document.getElementById('accept').value,
        title: document.getElementById('title').value.trim(),
        body: document.getElementById('body').value
      };
      try {
        var r = await fetch('/api/als/updates', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify(payload)
        });
        var data = await r.json().catch(function () { return {}; });
        if (!r.ok) {
          out.className = 'msg err';
          if (data && data.message) console.warn('[als]', data.error, data.message);
          out.textContent = window.GililLocale.userError((data && data.error) || '', GililPageLang.lang());
          return;
        }
        out.className = 'msg ok';
        out.textContent = tr('saved').replace('{id}', String(data.item && data.item.id));
        document.getElementById('body').value = '';
        loadList();
      } catch (e) {
        out.className = 'msg err';
        out.textContent = String(e && e.message ? e.message : e);
      }
    });
    reloadAls = loadList;
    loadList();
  </script>
</body>
</html>
