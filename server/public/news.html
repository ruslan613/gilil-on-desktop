<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gilil On</title>
  <script src="/ui-locale.js"></script>
  <script src="/ui-lang.js"></script>
  <script>
    (function () {
      try {
        var id = localStorage.getItem('gilil_theme') || 'dark';
        if (id === 'beige') id = 'bitrix';
        if (id === 'blue') id = 'cyan';
        var ok = { dark: 1, bitrix: 1, cyan: 1 };
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'beige') q = 'bitrix';
        if (q === 'blue') q = 'cyan';
        if (q && ok[q]) id = q;
        if (!ok[id]) id = 'dark';
        document.documentElement.dataset.theme = id;
        document.documentElement.dataset.surface = 'rich';
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.dataset.surface = 'rich';
      }
    })();
  </script>
  <link rel="stylesheet" href="/themes.css" />
  <style>
    /* News aliases → shell theme tokens from themes.css (data-theme=dark|bitrix|cyan) */
    :root {
      --chip: var(--bg-card-2, #221c17);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg-grad, var(--bg));
      background-color: var(--bg);
      color: var(--ink);
      color-scheme: inherit;
    }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.45;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 4px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    header p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    header a {
      color: var(--accent);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .toolbar button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .toolbar button:hover {
      border-color: var(--hover-line, var(--line));
      background: var(--hover-bg, var(--card));
    }
    .toolbar button.active {
      background: var(--accent);
      color: var(--accent-ink, #fff);
      border-color: var(--accent);
    }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .list { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: var(--elev-out-soft, 0 1px 0 rgba(0,0,0,0.03));
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .chip {
      background: var(--chip);
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
    }
    .chip.kind-new { background: color-mix(in srgb, var(--green, #22c55e) 22%, transparent); color: var(--green, #22c55e); }
    .chip.kind-change { background: color-mix(in srgb, #fbbf24 22%, transparent); color: #fbbf24; }
    .chip.kind-result { background: color-mix(in srgb, var(--blue, #3b82f6) 22%, transparent); color: var(--blue, #3b82f6); }
    .chip.kind-info { background: var(--chip); color: var(--muted); }
    html[data-theme="bitrix"] .chip.kind-change { color: #c87d00; background: rgba(200, 125, 0, 0.12); }
    .card h2 {
      font-size: 1.05rem;
      margin: 0 0 6px;
      font-weight: 600;
      color: var(--ink);
    }
    .card h2 a { color: inherit; text-decoration: none; }
    .card h2 a:hover { color: var(--accent); text-decoration: underline; }
    .body { font-size: 0.9rem; color: var(--muted); margin: 0 0 8px; }
    .body a { color: var(--accent); }
    .nmck { font-weight: 600; font-size: 0.95rem; color: var(--ink); }
    .empty { color: var(--muted); padding: 24px 0; text-align: center; }
    footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    footer code {
      color: var(--accent-hot, var(--accent));
    }
    /* Embed mode: ?embed=1 hides chrome */
    body.embed header p.lead,
    body.embed footer { display: none; }
    body.embed .wrap { padding: 8px; max-width: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p style="margin:0 0 10px;font-size:0.85rem"><a href="/shell-v2.html?section=tenders" data-i18n="nav.panel">Панель</a> · <a href="/shell-v2.html?section=crm">CRM</a> · <a href="/crm-tv.html">SRM TV</a></p>
      <h1 data-i18n="h1">Новости</h1>
      <p class="lead" data-i18n="lead">Свежие тендеры и обновления по освещению (Gilil On · мониторинг площадок РФ)</p>
    </header>
    <div class="toolbar" id="filters">
      <button type="button" data-kind="" class="active" data-i18n="filter.all">Все</button>
      <button type="button" data-kind="new" data-i18n="filter.new">Новые</button>
      <button type="button" data-kind="change" data-i18n="filter.change">Изменения</button>
      <button type="button" data-kind="result" data-i18n="filter.result">Итоги</button>
      <button type="button" data-kind="info" data-i18n="filter.info">Инфо</button>
    </div>
    <div class="status" id="status" data-i18n="loading">Загрузка…</div>
    <div class="list" id="list"></div>
    <footer data-i18n="footer">
      Данные обновляются ежедневным парсером npm run tenders:fetch.
    </footer>
  </div>
  <script>
    (function () {
      const DICT = {
        zh: {
          title: '新闻 — Gilil On',
          'nav.panel': '面板',
          h1: '新闻',
          lead: '照明招标与更新（Gilil On · 俄罗斯平台监测）',
          'filter.all': '全部', 'filter.new': '新的', 'filter.change': '变更', 'filter.result': '结果', 'filter.info': '信息',
          loading: '加载中…',
          footer: '数据由每日解析程序 npm run tenders:fetch 更新。',
          shown: '显示：{n}',
          emptyFeed: '还没有新闻。',
          empty: '没有记录',
          loadErr: '加载失败：',
          kindNew: '新的', kindChange: '变更', kindResult: '结果', kindInfo: '信息', kindOther: '其他',
          chatLeft: '聊天项目 · 剩余 {n}',
          chatNa: '聊天项目 · 无日期',
        },
        ru: {
          title: 'Новости — Gilil On',
          'nav.panel': 'Панель',
          h1: 'Новости',
          lead: 'Свежие тендеры и обновления по освещению (Gilil On · мониторинг площадок РФ)',
          'filter.all': 'Все', 'filter.new': 'Новые', 'filter.change': 'Изменения', 'filter.result': 'Итоги', 'filter.info': 'Инфо',
          loading: 'Загрузка…',
          footer: 'Данные обновляются ежедневным парсером npm run tenders:fetch.',
          shown: 'Показано: {n}',
          emptyFeed: 'Пока нет новостей.',
          empty: 'Нет записей',
          loadErr: 'Ошибка загрузки: ',
          kindNew: 'новый', kindChange: 'изменение', kindResult: 'итог', kindInfo: 'инфо', kindOther: 'прочее',
          chatLeft: 'Чат-проект · осталось {n}',
          chatNa: 'Чат-проект · н/д',
        },
        en: {
          title: 'News — Gilil On',
          'nav.panel': 'Panel',
          h1: 'News',
          lead: 'New lighting tenders and updates (Gilil On · Russian platform monitoring)',
          'filter.all': 'All', 'filter.new': 'New', 'filter.change': 'Changes', 'filter.result': 'Results', 'filter.info': 'Info',
          loading: 'Loading…',
          footer: 'Data is refreshed by the daily parser npm run tenders:fetch.',
          shown: 'Shown: {n}',
          emptyFeed: 'No news yet.',
          empty: 'No entries',
          loadErr: 'Could not load: ',
          kindNew: 'new', kindChange: 'change', kindResult: 'result', kindInfo: 'info', kindOther: 'other',
          chatLeft: 'Chat project · {n} left',
          chatNa: 'Chat project · n/a',
        },
      };
      let reloadNews = function () {};
      const tr = window.GililPageLang.bind(DICT, function () { reloadNews(); });
      const params = new URLSearchParams(location.search);
      if (params.get('embed') === '1') document.body.classList.add('embed');
      const apiBase = params.get('api') || '';
      let kind = params.get('kind') || '';
      const listEl = document.getElementById('list');
      const statusEl = document.getElementById('status');

      const THEME_KEY = 'gilil_theme';
      const THEME_IDS = ['dark', 'bitrix', 'cyan'];

      function applyNewsTheme(id) {
        if (id === 'beige') id = 'bitrix';
        if (id === 'blue') id = 'cyan';
        const theme = THEME_IDS.includes(id) ? id : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.surface = 'rich';
        return theme;
      }

      function readShellTheme() {
        try {
          let saved = localStorage.getItem(THEME_KEY);
          if (saved === 'beige') saved = 'bitrix';
          if (saved === 'blue') saved = 'cyan';
          return saved;
        } catch (_) {
          return null;
        }
      }

      (function bootTheme() {
        let id = readShellTheme();
        try {
          const q = new URLSearchParams(location.search).get('theme');
          if (q) id = q;
        } catch (_) {}
        applyNewsTheme(id || 'dark');
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'gilil:news-ready' }, location.origin);
          }
        } catch (_) {}
      })();

      window.addEventListener('storage', (e) => {
        if (e.key === THEME_KEY) applyNewsTheme(e.newValue || 'dark');
      });

      window.addEventListener('message', (e) => {
        try {
          if (e.origin !== location.origin) return;
          const data = e.data;
          if (data && data.type === 'gilil:theme' && data.theme) {
            applyNewsTheme(data.theme);
          }
        } catch (_) {}
      });

      // Keep in sync if shell writes theme while news is open in iframe (same tab).
      setInterval(() => {
        const t = readShellTheme();
        if (!t) return;
        if (document.documentElement.dataset.theme !== t) applyNewsTheme(t);
      }, 1500);

      const KIND_KEY = { new: 'kindNew', change: 'kindChange', result: 'kindResult', info: 'kindInfo' };
      const PLATFORM_RU = {
        zakupki: 'ЕИС / zakupki',
        b2b: 'B2B-Center',
        sber_ast: 'Сбер АСТ',
        rts: 'РТС',
        eetp: 'ЕЭТП',
        tender_ru: 'Тендер.ру',
        other: 'прочее',
      };

      function fmtDate(s) {
        if (!s) return '';
        const d = new Date(s);
        if (Number.isNaN(d.getTime())) return String(s).slice(0, 10);
        const loc = GililPageLang.lang() === 'zh' ? 'zh-CN' : GililPageLang.lang() === 'en' ? 'en-US' : 'ru-RU';
        return d.toLocaleDateString(loc, {
          day: '2-digit', month: 'short', year: 'numeric',
        });
      }
      function fmtMoney(n) {
        if (n == null) return null;
        const loc = GililPageLang.lang() === 'zh' ? 'zh-CN' : GililPageLang.lang() === 'en' ? 'en-US' : 'ru-RU';
        return new Intl.NumberFormat(loc, {
          style: 'currency', currency: 'RUB', maximumFractionDigits: 0,
        }).format(n);
      }

      async function load() {
        statusEl.textContent = tr('loading');
        const q = new URLSearchParams({ limit: '20' });
        if (kind) q.set('kind', kind);
        try {
          const res = await fetch(apiBase + '/api/public/tender-news?' + q.toString());
          const data = await res.json();
          if (!data.ok) throw new Error('bad response');
          statusEl.textContent = data.count
            ? tr('shown').replace('{n}', String(data.count))
            : tr('emptyFeed');
          listEl.innerHTML = '';
          if (!data.items.length) {
            listEl.innerHTML = '<div class="empty">' + escapeHtml(tr('empty')) + '</div>';
            return;
          }
          for (const it of data.items) {
            const card = document.createElement('article');
            card.className = 'card';
            const money = fmtMoney(it.nmck);
            const href = it.url || '#';
            card.innerHTML =
              '<div class="meta">' +
              '<span class="chip kind-' + (it.kind || 'info') + '">' +
              escapeHtml(tr(KIND_KEY[it.kind] || 'kindOther')) + '</span>' +
              '<span>' + fmtDate(it.published_at || it.created_at) + '</span>' +
              (it.platform
                ? '<span>' + (PLATFORM_RU[it.platform] || it.platform) + '</span>'
                : '') +
              (it.tender_no ? '<span>№ ' + it.tender_no + '</span>' : '') +
              '</div>' +
              '<h2><a href="' + href + '" target="_blank" rel="noopener">' +
              escapeHtml(it.title) + '</a></h2>' +
              (it.body ? '<p class="body">' + escapeHtml(it.body) + '</p>' : '') +
              (money ? '<div class="nmck">' + money + '</div>' : '') +
              (it.project
                ? '<p class="body"><a href="' + it.project.open_path + '">' +
                  escapeHtml(it.project.days_left != null
                    ? tr('chatLeft').replace('{n}', String(it.project.days_left))
                    : tr('chatNa')) +
                  '</a></p>'
                : '');
            listEl.appendChild(card);
          }
        } catch (err) {
          console.warn('[news]', err && err.message);
          statusEl.textContent = window.GililLocale.userError('network', GililPageLang.lang());
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      document.getElementById('filters').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-kind]');
        if (!btn) return;
        kind = btn.getAttribute('data-kind') || '';
        document.querySelectorAll('#filters button').forEach((b) =>
          b.classList.toggle('active', b === btn)
        );
        load();
      });

      reloadNews = load;
      load();
      // soft auto-refresh every 10 min when left open
      setInterval(load, 600000);
    })();
  </script>
</body>
</html>
